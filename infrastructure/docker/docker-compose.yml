services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horii_fn
      POSTGRES_USER: horii_fn
      POSTGRES_PASSWORD: horii_fn_dev_only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["horii_fn_pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U horii_fn -d horii_fn"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["horii_fn_redis:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
volumes: { horii_fn_pg: {}, horii_fn_redis: {} }
